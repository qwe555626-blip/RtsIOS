<style>
:root{color-scheme:dark;--glass:rgba(12,21,21,.86);--line:rgba(204,231,211,.2);--text:#eaf1e9;--muted:#a9b8ad}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;background:#101815;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;overflow:hidden;touch-action:none}.app{position:relative;width:100vw;height:100dvh;background:#293b30}.world{position:absolute;inset:0}.world canvas{display:block;width:100%;height:100%;touch-action:none}.vignette{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#07100cb0,transparent 22%,transparent 73%,#07100cbb)}.topbar{position:absolute;left:2%;right:2%;top:max(8px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none}.brand,.topright{display:flex;align-items:center;gap:8px}.brand>* ,.topright>*{pointer-events:auto}.mark{width:32px;height:32px;border:1px solid #d6e0cb88;border-radius:9px;display:grid;place-items:center;background:#18251ecc;font-size:17px}.brand h1{font-size:clamp(12px,2vw,19px);margin:0;letter-spacing:.1em}.brand small{display:block;color:#cad2c3a8;font-size:7px;letter-spacing:.14em;margin-top:3px}.pill{border:1px solid var(--line);border-radius:8px;background:var(--glass);padding:6px 9px;font-size:9px;backdrop-filter:blur(10px);white-space:nowrap}.green{color:#92d9a8}.credits{color:#f0d47a;font-weight:800}.side{position:absolute;left:2%;top:15%;width:min(210px,26vw);display:grid;gap:6px;pointer-events:none}.panel{background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:9px 11px;backdrop-filter:blur(12px);box-shadow:0 10px 28px #0003}.eyebrow{font-size:8px;letter-spacing:.14em;color:#9eafa2}.mission-title{font-size:12px;font-weight:700;margin:5px 0}.copy{font-size:9px;line-height:1.5;color:#bbc8bb}.objective{display:flex;gap:7px;align-items:center;margin-top:7px;font-size:9px}.dot{width:7px;height:7px;border-radius:50%;background:#dfc26e;box-shadow:0 0 8px #dfc26e88;flex:none}.unitinfo{font-size:9px;line-height:1.65;margin-top:6px;color:#d6e1d6}.right{position:absolute;right:2%;top:15%;width:min(150px,19vw);pointer-events:none}.map{height:82px;border-radius:7px;background:linear-gradient(135deg,#65745c,#364d40 38%,#59705a 39%,#47533c 73%,#778066);position:relative;overflow:hidden}.map:before{content:"";position:absolute;left:36%;top:-25%;width:26%;height:150%;background:#608e8b;transform:rotate(34deg);opacity:.85}.pin{position:absolute;width:7px;height:7px;border:1px solid white;border-radius:50%;background:#75d7b5;left:27%;top:34%;z-index:1}.pin.enemy{left:73%;top:63%;background:#dc7365}.legend{display:flex;justify-content:space-between;font-size:8px;color:#aab8ad;margin-top:6px}.commands{position:absolute;left:50%;bottom:max(9px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(710px,82vw);display:flex;align-items:center;gap:5px;padding:6px;background:var(--glass);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(14px);box-shadow:0 12px 35px #0005}.cmd{height:40px;min-width:52px;padding:0 7px;border:1px solid #ffffff20;border-radius:8px;background:linear-gradient(#293935,#182321);color:#e6eee6;font:inherit;cursor:pointer;touch-action:manipulation}.cmd:active,.cmd.active{background:#386253;border-color:#94c4a877}.cmd:disabled{opacity:.42}.cmd span{display:block;font-size:14px}.cmd small{font-size:7px;color:#bdc9bd;white-space:nowrap}.divider{height:27px;width:1px;background:var(--line)}.selected{flex:1;min-width:65px;padding-left:4px}.selected b{display:block;font-size:9px}.selected small{display:block;color:#a9b8ad;font-size:8px;margin-top:3px}.status{position:absolute;left:2%;bottom:18px;font-size:8px;color:#e3eadcbb;pointer-events:none;max-width:28vw}.toast{position:absolute;left:50%;top:12%;transform:translate(-50%,-10px);opacity:0;padding:8px 12px;background:#101817ef;border:1px solid var(--line);border-radius:8px;font-size:10px;transition:.2s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.rotate{display:none;position:absolute;inset:0;background:#111917;z-index:10;align-items:center;justify-content:center;text-align:center;padding:24px}.rotate b{font-size:28px;display:block;margin-bottom:10px}.rotate span{font-size:13px;color:#a9b8ad;line-height:1.6}@media(orientation:portrait){.rotate{display:flex}}@media(max-height:430px){.topbar{top:4px}.side,.right{top:48px}.panel{padding:6px 8px}.commands{bottom:4px;padding:4px}.cmd{height:35px}.status{bottom:5px}}

<body><main class="app"><div class="world" id="world"></div><div class="vignette"></div>
<header class="topbar"><div class="brand"><div class="mark">⌖</div><div><h1>地球战区</h1><small>EARTH THEATER · REAL-TIME STRATEGY</small></div></div><div class="topright"><div class="pill green">● 3D 战斗</div><div class="pill credits" id="credits">◈ 1200</div><div class="pill" id="clock">☼ 00:00</div></div></header>
<aside class="side"><section class="panel"><div class="eyebrow">战区任务 / OBJECTIVE</div><div class="mission-title">控制河谷补给线</div><div class="copy">虚构战区 · 占领中立据点获取资源，保护前哨并摧毁敌方指挥所。</div><div class="objective"><i class="dot"></i><span id="objective">控制据点：我方 0 / 2</span></div></section><section class="panel"><div class="eyebrow">选中单位 / SELECTED</div><div class="unitinfo" id="unitinfo">点击我方步兵或载具选择，再点地面下达移动命令。</div></section></aside>
<aside class="right"><section class="panel"><div class="eyebrow" style="margin-bottom:6px">战区地图</div><div class="map"><i class="pin"></i><i class="pin enemy"></i></div><div class="legend"><span>● 我方</span><span>● 敌方</span></div></section><section class="panel" style="margin-top:6px"><div class="eyebrow">战场态势</div><div class="copy" style="margin-top:5px">地形　河谷 / 丘陵<br>据点　<span id="captureStatus">争夺中</span><br>收入　每秒 +<span id="income">2</span></div></section></aside>
<div class="status" id="message">点击我方部队选择，再点击地面移动；步兵靠近据点可占领。</div>
<nav class="commands"><button class="cmd" id="buildInf"><span>♟</span><small>步兵 · 100</small></button><button class="cmd" id="buildTank"><span>▰</span><small>坦克 · 350</small></button><button class="cmd" id="buildScout"><span>◉</span><small>侦察 · 220</small></button><button class="cmd" id="buildSupply"><span>▤</span><small>补给 · 180</small></button><div class="divider"></div><div class="selected"><b id="selName">战术指令</b><small id="selDetail">占领据点发展经济</small></div><button class="cmd" id="restart"><span>↻</span><small>重开</small></button></nav><div class="toast" id="toast"></div><div class="rotate"><div><b>↻ 请横屏</b><span>请旋转手机查看并操作<br>单指拖动镜头，点击地面下达移动命令</span></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{'use strict';const host=document.getElementById('world');if(!window.THREE){document.getElementById('message').textContent='3D 引擎加载失败，请检查网络后刷新页面。';return}const T=THREE;let scene,camera,renderer,raycaster,ground,units=[],effects=[],selected=null,credits=1200,elapsed=0,ended=false,clock=new T.Clock(),points=[],pointer=null;const colors={blue:0x62bda5,red:0xc96d5b};
function material(c,r=.86){return new T.MeshStandardMaterial({color:c,roughness:r})}
function setup(){scene=new T.Scene();scene.background=new T.Color(0x9aab96);scene.fog=new T.Fog(0x9aab96,60,125);camera=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,180);camera.position.set(0,42,45);camera.lookAt(0,0,0);renderer=new T.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;host.appendChild(renderer.domElement);scene.add(new T.HemisphereLight(0xe4f0dc,0x485344,2));const sun=new T.DirectionalLight(0xffedcb,2);sun.position.set(-25,38,14);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-42;sun.shadow.camera.right=42;sun.shadow.camera.top=42;sun.shadow.camera.bottom=-42;scene.add(sun);raycaster=new T.Raycaster();makeMap();reset();addEventListener('resize',resize);renderer.domElement.addEventListener('pointerdown',onDown);renderer.domElement.addEventListener('pointermove',onMove);renderer.domElement.addEventListener('pointerup',onUp);renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());document.getElementById('buildInf').onclick=()=>build('infantry');document.getElementById('buildTank').onclick=()=>build('tank');document.getElementById('buildScout').onclick=()=>build('scout');document.getElementById('buildSupply').onclick=()=>build('supply');document.getElementById('restart').onclick=reset;animate()}
function resize(){if(!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function makeMap(){const geo=new T.PlaneGeometry(72,72,72,72);geo.rotateX(-Math.PI/2);const p=geo.attributes.position,cs=[];for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i);let h=.12*Math.sin(x*.35)*Math.cos(z*.32)+.06*Math.sin(z*.7+x*.25);if(Math.abs(x+z*.5)<4)h-=.25;p.setY(i,h);const n=(Math.sin(x*.7+z*.23)*Math.cos(z*.51)+1)/2,c=new T.Color().setRGB(.24+n*.07,.32+n*.09,.22+n*.04);if(Math.abs(x+z*.5)<4)c.setRGB(.22,.38,.38);cs.push(c.r,c.g,c.b)}geo.setAttribute('color',new T.Float32BufferAttribute(cs,3));geo.computeVertexNormals();ground=new T.Mesh(geo,new T.MeshStandardMaterial({vertexColors:true,roughness:1}));ground.receiveShadow=true;scene.add(ground);const riverCurve=new T.CatmullRomCurve3([[-34,.02,-13],[-20,.02,-9],[-10,.02,-4],[0,.02,0],[12,.02,3],[24,.02,8],[36,.02,10]].map(v=>new T.Vector3(...v)));const river=new T.Mesh(new T.TubeGeometry(riverCurve,90,1.15,8,false),material(0x548987,.42));river.position.y=.12;scene.add(river);const roadCurve=new T.CatmullRomCurve3([[-35,.12,18],[-20,.12,13],[-8,.12,14],[2,.12,17],[16,.12,13],[34,.12,15]].map(v=>new T.Vector3(...v)));const road=new T.Mesh(new T.TubeGeometry(roadCurve,80,.62,6,false),material(0x746e58));road.position.y=.13;scene.add(road);for(let i=0;i<30;i++){const x=(Math.random()-.5)*66,z=(Math.random()-.5)*58;if(Math.abs(x+z*.5)<6)continue;const rock=new T.Mesh(new T.DodecahedronGeometry(.8+Math.random()*1.7,0),material(i%2?0x69745a:0x7b8063));rock.position.set(x,.35,z);rock.scale.y=.45+Math.random()*.6;rock.castShadow=true;scene.add(rock)}for(let i=0;i<48;i++){const x=(Math.random()-.5)*68,z=(Math.random()-.5)*60;if(Math.abs(x+z*.5)<5)continue;tree(x,z)}const bridge=new T.Mesh(new T.BoxGeometry(5,.25,2.7),material(0x93866b));bridge.position.set(0,.35,0);bridge.rotation.y=-.45;bridge.castShadow=true;scene.add(bridge);makeBase(-26,14,'blue');makeBase(26,-14,'red');points=[makePoint(-5,-8,'北桥前哨'),makePoint(8,9,'河谷补给站')]}
function tree(x,z){const g=new T.Group(),tr=new T.Mesh(new T.CylinderGeometry(.13,.2,1.25,5),material(0x584936)),c=new T.Mesh(new T.ConeGeometry(.85,2.25,6),material(Math.random()>.5?0x3e6047:0x4b6949));tr.position.y=.62;c.position.y=2;tr.castShadow=c.castShadow=true;g.add(tr,c);g.position.set(x,0,z);scene.add(g)}
function makeBase(x,z,team){const g=new T.Group(),body=new T.Mesh(new T.BoxGeometry(5,1.2,4),material(team==='blue'?0x426e69:0x84584e)),tower=new T.Mesh(new T.BoxGeometry(1.7,2.3,1.7),material(team==='blue'?0x709487:0xa87867)),roof=new T.Mesh(new T.ConeGeometry(1.35,.8,4),material(0x434a3c));body.position.y=.65;tower.position.y=2.25;roof.position.y=3.8;roof.rotation.y=Math.PI/4;body.castShadow=tower.castShadow=true;g.add(body,tower,roof);g.position.set(x,0,z);g.userData.baseTeam=team;g.userData.base=true;scene.add(g);if(team==='blue')window.playerBase=g;else window.enemyBase=g;const ring=new T.Mesh(new T.RingGeometry(3.2,3.35,40),new T.MeshBasicMaterial({color:colors[team],side:T.DoubleSide,transparent:true,opacity:.8}));ring.rotation.x=-Math.PI/2;ring.position.set(x,.1,z);scene.add(ring)}
function makePoint(x,z,name){const g=new T.Group(),pad=new T.Mesh(new T.CylinderGeometry(2.2,2.5,.25,12),material(0x6d7058)),pole=new T.Mesh(new T.CylinderGeometry(.07,.1,2.4,6),material(0xd0c7a2)),flag=new T.Mesh(new T.BoxGeometry(.85,.45,.06),material(0xa99b6b));pad.position.y=.15;pole.position.y=1.45;flag.position.set(.4,2.1,0);g.add(pad,pole,flag);g.position.set(x,0,z);scene.add(g);const ring=new T.Mesh(new T.RingGeometry(2.6,2.8,36),new T.MeshBasicMaterial({color:0xd9bd69,side:T.DoubleSide,transparent:true,opacity:.85}));ring.rotation.x=-Math.PI/2;ring.position.set(x,.08,z);scene.add(ring);const point={x,z,name,owner:'neutral',progress:0,group:g,ring,flag};return point}
function makeUnit(team,type,x,z){const g=new T.Group(),color=material(colors[team]),dark=material(team==='blue'?0x283c38:0x42302e),accent=material(team==='blue'?0x9fc8a8:0xe09b7d);let hp,maxHp,range,speed,damage;const mesh=(geo,m,y)=>{const o=new T.Mesh(geo,m);o.position.y=y;o.castShadow=true;g.add(o);return o};if(type==='infantry'){mesh(new T.CapsuleGeometry(.28,.65,3,6),color,1.05);mesh(new T.SphereGeometry(.22,8,6),accent,1.68);for(const s of [-1,1]){const leg=mesh(new T.CylinderGeometry(.09,.12,.55,6),dark,.43);leg.position.x=s*.13;const arm=mesh(new T.CylinderGeometry(.07,.1,.48,6),color,1.08);arm.position.x=s*.31;arm.rotation.z=s*.28}const rifle=mesh(new T.BoxGeometry(.08,.08,.8),dark,1.18);rifle.position.set(.28,0,.34);maxHp=70;range=6.5;speed=2.7;damage=8}else{const len=type==='tank'?2.4:2.1,w=type==='tank'?1.5:1.2;mesh(new T.BoxGeometry(w,.62,len),color,.68);for(const s of [-1,1]){const tr=mesh(new T.BoxGeometry(.28,.45,len+.12),dark,.43);tr.position.x=s*(w/2+.1)}if(type==='tank'){mesh(new T.CylinderGeometry(.53,.58,.42,10),accent,1.18);const barrel=mesh(new T.CylinderGeometry(.105,.13,1.25,8),dark,1.22);barrel.rotation.x=Math.PI/2;barrel.position.z=-.78;maxHp=210;range=11;speed=2.25;damage=20}else if(type==='scout'){const cabin=mesh(new T.BoxGeometry(.9,.68,.85),accent,1.18);cabin.position.z=-.15;maxHp=95;range=8;speed=4;damage=6}else{const cabin=mesh(new T.BoxGeometry(1.05,.72,.72),accent,1.18);cabin.position.z=-.42;maxHp=135;range=3.5;speed=1.8;damage=0}}hp=maxHp;const health=new T.Mesh(new T.PlaneGeometry(1.2,.12),new T.MeshBasicMaterial({color:0x52dd81,side:T.DoubleSide}));health.position.set(0,2.3,0);g.add(health);g.position.set(x,0,z);scene.add(g);const u={id:Math.random().toString(36).slice(2),team,type,group:g,hp,maxHp,range,speed,damage,target:null,cool:.3,alive:true,health};g.traverse(o=>o.userData.unit=u);units.push(u);return u}
function reset(){for(const u of units)scene.remove(u.group);units=[];for(const e of effects)scene.remove(e.object);effects=[];selected=null;credits=1200;elapsed=0;ended=false;for(const p of points){p.owner='neutral';p.progress=0;paintPoint(p)}makeUnit('blue','infantry',-21,10);makeUnit('blue','infantry',-19,11);makeUnit('blue','tank',-18,14);makeUnit('blue','scout',-23,15);makeUnit('blue','supply',-25,10);makeUnit('red','infantry',20,-9);makeUnit('red','infantry',22,-11);makeUnit('red','tank',19,-14);makeUnit('red','scout',24,-13);updateUI();toast('战斗开始：派步兵占领中立据点')}
function paintPoint(p){p.flag.material.color.set(p.owner==='blue'?0x65c9a8:p.owner==='red'?0xd87564:0xa99b6b);p.ring.material.color.set(p.owner==='blue'?0x65c9a8:p.owner==='red'?0xd87564:0xd9bd69)}
function build(type){if(ended)return;const d={infantry:[100,-23,14],tank:[350,-22,13],scout:[220,-25,16],supply:[180,-26,11]}[type];if(credits<d[0]){toast('资金不足：占领据点或等待补给收入');return}credits-=d[0];const u=makeUnit('blue',type,d[1]+Math.random()*2,d[2]+Math.random()*2);if(selected)select(u);updateUI();toast('已部署 '+unitName(type))}
function unitName(t){return{infantry:'步兵班',tank:'主战坦克',scout:'侦察车',supply:'补给车'}[t]}
function select(u){if(selected&&selected.ring)scene.remove(selected.ring);selected=u;if(u){u.ring=new T.Mesh(new T.RingGeometry(1,1.16,32),new T.MeshBasicMaterial({color:0xf0d47a,side:T.DoubleSide}));u.ring.rotation.x=-Math.PI/2;u.ring.position.set(u.group.position.x,.12,u.group.position.z);scene.add(u.ring)}updateUI()}
function pointerRay(e){const r=renderer.domElement.getBoundingClientRect(),m=new T.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);raycaster.setFromCamera(m,camera);return raycaster}
function onDown(e){if(e.button===2){pointerRay(e);const h=raycaster.intersectObject(ground);if(selected&&h.length)selected.target=h[0].point.clone();return}pointer={x:e.clientX,y:e.clientY,moved:false,camX:camera.position.x,camZ:camera.position.z};renderer.domElement.setPointerCapture(e.pointerId)}
function onMove(e){if(!pointer)return;const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;if(Math.abs(dx)+Math.abs(dy)>7)pointer.moved=true;if(pointer.moved){const scale=camera.position.y/650;camera.position.x=pointer.camX-dx*scale;camera.position.z=pointer.camZ-dy*scale;camera.lookAt(camera.position.x*.08,0,camera.position.z*.08)}}
function onUp(e){if(!pointer)return;const moved=pointer.moved;pointer=null;if(moved||ended)return;const r=pointerRay(e),hits=r.intersectObjects(scene.children,true);let unit=null,base=null;for(const h of hits){let o=h.object;while(o){if(o.userData.unit){unit=o.userData.unit;break}if(o.userData.base){base=o;break}o=o.parent}if(unit||base)break}if(unit&&unit.team==='blue'){select(unit);document.getElementById('message').textContent=unitName(unit.type)+'已选中 · 点击地面移动；自动攻击射程内敌军';return}if(selected){if(base&&base.userData.baseTeam==='red'){selected.target=base.position.clone();selected.targetEntity='base';toast('进攻命令：敌方指挥所')}else{const gh=r.intersectObject(ground);if(gh.length){selected.target=gh[0].point.clone();selected.targetEntity=null;toast('移动命令已下达')}}}}
function shoot(a,b){const start=a.group.position.clone();start.y=1.25;let end;if(b.group){end=b.group.position.clone();end.y=1}else{end=b.position.clone();end.y=1}const line=new T.Line(new T.BufferGeometry().setFromPoints([start,end]),new T.LineBasicMaterial({color:a.team==='blue'?0x9af4d3:0xff9a78,transparent:true,opacity:.95}));scene.add(line);effects.push({object:line,life:.13})}
function tick(dt){if(ended)return;elapsed+=dt;credits+=dt*(2+points.filter(p=>p.owner==='blue').length*3);for(const p of points){const blue=units.filter(u=>u.alive&&u.team==='blue'&&u.type==='infantry'&&Math.hypot(u.group.position.x-p.x,u.group.position.z-p.z)<4).length;const red=units.filter(u=>u.alive&&u.team==='red'&&u.type==='infantry'&&Math.hypot(u.group.position.x-p.x,u.group.position.z-p.z)<4).length;if(blue&& !red){p.progress=Math.min(1,p.progress+dt*.12);if(p.progress>=1&&p.owner!=='blue'){p.owner='blue';paintPoint(p);toast(p.name+'已由我方控制')}}else if(red&&!blue){p.progress=Math.max(-1,p.progress-dt*.12);if(p.progress<=-1&&p.owner!=='red'){p.owner='red';paintPoint(p)}}else if(!blue&&!red&&p.owner==='neutral')p.progress*=.998}
for(const u of units){if(!u.alive)continue;u.cool-=dt;if(u.ring)u.ring.position.set(u.group.position.x,.12,u.group.position.z);u.health.scale.x=Math.max(.02,u.hp/u.maxHp);let target=null,best=u.range;for(const e of units){if(!e.alive||e.team===u.team)continue;const d=u.group.position.distanceTo(e.group.position);if(d<best){best=d;target=e}}if(target&&u.damage>0){if(u.cool<=0){u.cool=u.type==='tank'?1.15:.85;target.hp-=u.damage;shoot(u,target);if(target.hp<=0){target.alive=false;scene.remove(target.group);if(target.ring)scene.remove(target.ring);if(selected===target){select(null)}if(u.team==='blue')credits+=45}}continue}
if(u.team==='red'&&!u.target){u.target=new T.Vector3(-19,12,0)}if(u.target){const p=u.group.position,dx=u.target.x-p.x,dz=u.target.z-p.z,len=Math.hypot(dx,dz);if(u.targetEntity==='base'&&len<5){if(u.cool<=0){u.cool=1.2;window.playerBase.userData.hp=(window.playerBase.userData.hp||800)-u.damage;shoot(u,{position:window.playerBase.position});if(window.playerBase.userData.hp<=0)finish(false)}continue}if(len<.6){u.target=null;u.targetEntity=null}else{const step=Math.min(len,u.speed*dt);p.x+=dx/len*step;p.z+=dz/len*step;u.group.rotation.y=Math.atan2(dx,dz)}}}
for(const ef of effects){ef.life-=dt}effects=effects.filter(e=>{if(e.life<=0){scene.remove(e.object);return false}return true});if(Math.floor(elapsed)%10===0&&Math.floor(elapsed-dt)!==Math.floor(elapsed))credits+=35;const reds=units.some(u=>u.alive&&u.team==='red');if(!reds)finish(true);updateUI()}
function finish(win){if(ended)return;ended=true;document.getElementById('objective').textContent=win?'任务完成 · 战区已控制':'任务失败 · 前哨失守';toast(win?'胜利！敌方部队已被击退':'任务失败！重新部署再试')}
function updateUI(){document.getElementById('credits').textContent='◈ '+Math.floor(credits);document.getElementById('clock').textContent='☼ '+String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(Math.floor(elapsed%60)).padStart(2,'0');const n=points.filter(p=>p.owner==='blue').length;document.getElementById('objective').textContent='控制据点：我方 '+n+' / '+points.length;document.getElementById('captureStatus').textContent=n===2?'我方控制':n?'部分控制':'争夺中';document.getElementById('income').textContent=2+n*3;const el=document.getElementById('unitinfo');if(!selected){el.textContent='点击我方步兵或载具选择，再点地面下达移动命令。';document.getElementById('selName').textContent='战术指令';document.getElementById('selDetail').textContent='占领据点发展经济';return}el.innerHTML=unitName(selected.type)+' · 我方<br>生命 '+Math.max(0,Math.ceil(selected.hp))+'/'+selected.maxHp+'　射程 '+selected.range+'<br>速度 '+selected.speed.toFixed(1)+'　'+(selected.type==='tank'?'重装甲 · 对地强':'可自动交战');document.getElementById('selName').textContent=unitName(selected.type);document.getElementById('selDetail').textContent='生命 '+Math.max(0,Math.ceil(selected.hp))+'/'+selected.maxHp+' · 自动交战'}
let toastTimer;function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2100)}function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);tick(dt);renderer.render(scene,camera)}setup()})();
</script></body></html>
