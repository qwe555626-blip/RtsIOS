<style>
:root{color-scheme:dark;--glass:rgba(12,21,21,.84);--line:rgba(204,231,211,.2);--text:#eaf1e9;--muted:#a9b8ad}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;background:#101815;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;overflow:hidden;touch-action:none}.app{position:relative;width:100vw;height:100dvh;background:#293b30}.world{position:absolute;inset:0}.world canvas{display:block;width:100%;height:100%;touch-action:none}.vignette{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#07100cb0,transparent 22%,transparent 73%,#07100cbb);}.topbar{position:absolute;left:2%;right:2%;top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none}.brand,.topright{display:flex;align-items:center;gap:9px}.brand>* ,.topright>*{pointer-events:auto}.mark{width:34px;height:34px;border:1px solid #d6e0cb88;border-radius:10px;display:grid;place-items:center;background:#18251ecc;font-size:18px}.brand h1{font-size:clamp(13px,2vw,20px);margin:0;letter-spacing:.1em}.brand small{display:block;color:#cad2c3a8;font-size:8px;letter-spacing:.16em;margin-top:3px}.pill{border:1px solid var(--line);border-radius:8px;background:var(--glass);padding:7px 10px;font-size:10px;backdrop-filter:blur(10px);white-space:nowrap}.green{color:#92d9a8}.credits{color:#f0d47a;font-weight:800}.side{position:absolute;left:2%;top:16%;width:min(218px,27vw);display:grid;gap:7px;pointer-events:none}.panel{background:var(--glass);border:1px solid var(--line);border-radius:11px;padding:10px 12px;backdrop-filter:blur(12px);box-shadow:0 10px 28px #0003}.eyebrow{font-size:8px;letter-spacing:.14em;color:#9eafa2}.mission-title{font-size:13px;font-weight:700;margin:5px 0}.copy{font-size:9px;line-height:1.55;color:#bbc8bb}.objective{display:flex;gap:7px;align-items:center;margin-top:7px;font-size:9px}.dot{width:7px;height:7px;border-radius:50%;background:#dfc26e;box-shadow:0 0 8px #dfc26e88;flex:none}.unitinfo{font-size:10px;line-height:1.7;margin-top:6px;color:#d6e1d6}.right{position:absolute;right:2%;top:16%;width:min(155px,19vw);pointer-events:none}.map{height:88px;border-radius:7px;background:linear-gradient(135deg,#65745c,#364d40 38%,#59705a 39%,#47533c 73%,#778066);position:relative;overflow:hidden}.map:before{content:"";position:absolute;left:36%;top:-25%;width:26%;height:150%;background:#608e8b;transform:rotate(34deg);opacity:.85}.pin{position:absolute;width:7px;height:7px;border:1px solid white;border-radius:50%;background:#75d7b5;left:27%;top:34%;z-index:1}.pin.enemy{left:73%;top:63%;background:#dc7365}.legend{display:flex;justify-content:space-between;font-size:8px;color:#aab8ad;margin-top:6px}.commands{position:absolute;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(660px,78vw);display:flex;align-items:center;gap:6px;padding:7px;background:var(--glass);border:1px solid var(--line);border-radius:13px;backdrop-filter:blur(14px);box-shadow:0 12px 35px #0005}.cmd{height:43px;min-width:55px;padding:0 8px;border:1px solid #ffffff20;border-radius:8px;background:linear-gradient(#293935,#182321);color:#e6eee6;font:inherit;cursor:pointer;touch-action:manipulation}.cmd:active{background:#386253}.cmd:disabled{opacity:.42}.cmd span{display:block;font-size:15px}.cmd small{font-size:8px;color:#bdc9bd;white-space:nowrap}.divider{height:29px;width:1px;background:var(--line)}.selected{flex:1;min-width:72px;padding-left:4px}.selected b{display:block;font-size:9px}.selected small{display:block;color:#a9b8ad;font-size:8px;margin-top:3px}.status{position:absolute;left:2%;bottom:20px;font-size:9px;color:#e3eadcbb;pointer-events:none}.toast{position:absolute;left:50%;top:13%;transform:translate(-50%,-10px);opacity:0;padding:8px 13px;background:#101817ef;border:1px solid var(--line);border-radius:8px;font-size:10px;transition:.2s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.rotate{display:none;position:absolute;inset:0;background:#111917;z-index:10;align-items:center;justify-content:center;text-align:center;padding:24px}.rotate b{font-size:30px;display:block;margin-bottom:10px}.rotate span{font-size:13px;color:#a9b8ad;line-height:1.6}@media(orientation:portrait){.rotate{display:flex}}@media(max-height:430px){.topbar{top:5px}.side,.right{top:54px}.panel{padding:7px 9px}.commands{bottom:5px;padding:5px}.cmd{height:37px}.status{bottom:7px}}

<body><main class="app"><div class="world" id="world"></div><div class="vignette"></div>
<header class="topbar"><div class="brand"><div class="mark">⌖</div><div><h1>地球战区</h1><small>EARTH THEATER · REAL-TIME STRATEGY</small></div></div><div class="topright"><div class="pill green">● 3D 战斗演示</div><div class="pill credits" id="credits">◈ 1200</div><div class="pill" id="clock">☼ 00:00</div></div></header>
<aside class="side"><section class="panel"><div class="eyebrow">战区任务 / OBJECTIVE</div><div class="mission-title">守住山谷补给线</div><div class="copy">虚构战区 · 控制河谷路口，击退敌军并保护前哨。</div><div class="objective"><i class="dot"></i><span id="objective">摧毁敌方指挥所</span></div></section><section class="panel"><div class="eyebrow">选中单位 / SELECTED</div><div class="unitinfo" id="unitinfo">未选择单位<br>点击我方步兵或载具选择，再点地面下达移动命令。</div></section></aside>
<aside class="right"><section class="panel"><div class="eyebrow" style="margin-bottom:7px">战区地图</div><div class="map"><i class="pin"></i><i class="pin enemy"></i></div><div class="legend"><span>● 我方</span><span>● 敌方</span></div></section><section class="panel" style="margin-top:7px"><div class="eyebrow">战场态势</div><div class="copy" style="margin-top:5px">地形　河谷 / 丘陵<br>补给　<span id="supply">稳定</span><br>天气　多云</div></section></aside>
<div class="status" id="message">点选部队，再点击地图移动；部队会自动攻击射程内敌军。</div>
<nav class="commands"><button class="cmd" id="buildInf"><span>♟</span><small>步兵 · 100</small></button><button class="cmd" id="buildTank"><span>▰</span><small>坦克 · 350</small></button><button class="cmd" id="buildScout"><span>◉</span><small>侦察 · 220</small></button><button class="cmd" id="buildSupply"><span>▤</span><small>补给 · 180</small></button><div class="divider"></div><div class="selected"><b id="selName">战术指令</b><small id="selDetail">选择单位 / 控制据点获取资源</small></div><button class="cmd" id="restart"><span>↻</span><small>重开</small></button></nav><div class="toast" id="toast"></div><div class="rotate"><div><b>↻ 请横屏</b><span>这是一款横屏 3D 即时战斗原型<br>请旋转手机查看并操作</span></div></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js"></script>
<script>
(()=>{'use strict';const host=document.getElementById('world');if(!window.THREE){document.getElementById('message').textContent='3D 引擎加载失败，请检查网络后刷新页面。';return}const THREE=window.THREE;let scene,camera,renderer,raycaster,ground,units=[],effects=[],selected=null,credits=1200,elapsed=0,ended=false,clock=new THREE.Clock();const terrainSize=70;const colors={blue:0x62bda5,red:0xc96d5b};
function mat(color,rough=.85){return new THREE.MeshStandardMaterial({color,roughness:rough})}function setup(){scene=new THREE.Scene();scene.background=new THREE.Color(0x9aab96);scene.fog=new THREE.Fog(0x9aab96,55,115);camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,180);camera.position.set(0,39,42);camera.lookAt(0,0,0);renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xe4f0dc,0x485344,2.1));const sun=new THREE.DirectionalLight(0xffedcb,2.1);sun.position.set(-25,38,14);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-42;sun.shadow.camera.right=42;sun.shadow.camera.top=42;sun.shadow.camera.bottom=-42;scene.add(sun);raycaster=new THREE.Raycaster();makeMap();reset();window.addEventListener('resize',resize);renderer.domElement.addEventListener('pointerdown',onPointer);document.getElementById('buildInf').onclick=()=>build('infantry');document.getElementById('buildTank').onclick=()=>build('tank');document.getElementById('buildScout').onclick=()=>build('scout');document.getElementById('buildSupply').onclick=()=>build('supply');document.getElementById('restart').onclick=reset;animate()}
function resize(){if(!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function makeMap(){const geo=new THREE.PlaneGeometry(terrainSize,terrainSize,70,70);geo.rotateX(-Math.PI/2);const pos=geo.attributes.position;const colorsAttr=[];for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i);let h=.08*Math.sin(x*.45)*Math.cos(z*.36)+.04*Math.sin(z*.8+x*.2);if(Math.abs(x+z*.5)<4)h-=.3;pos.setY(i,h);const n=(Math.sin(x*.7+z*.23)*Math.cos(z*.51)+1)/2;const c=new THREE.Color().setRGB(.24+n*.07,.32+n*.09,.22+n*.04);if(Math.abs(x+z*.5)<4)c.setRGB(.22,.38,.38);colorsAttr.push(c.r,c.g,c.b)}geo.setAttribute('color',new THREE.Float32BufferAttribute(colorsAttr,3));geo.computeVertexNormals();ground=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1}));ground.receiveShadow=true;ground.userData.ground=true;scene.add(ground);
// River ribbon winding through the valley
const riverPts=[new THREE.Vector3(-31,.06,-12),new THREE.Vector3(-19,.06,-9),new THREE.Vector3(-10,.06,-4),new THREE.Vector3(0,.06,0),new THREE.Vector3(10,.06,3),new THREE.Vector3(22,.06,7),new THREE.Vector3(34,.06,9)];const curve=new THREE.CatmullRomCurve3(riverPts);const river=new THREE.Mesh(new THREE.TubeGeometry(curve,80,1.25,8,false),mat(0x548987,.42));river.position.y=.12;scene.add(river);const roadPts=[new THREE.Vector3(-33,.15,18),new THREE.Vector3(-20,.15,13),new THREE.Vector3(-9,.15,14),new THREE.Vector3(2,.15,17),new THREE.Vector3(15,.15,13),new THREE.Vector3(30,.15,15)];const roadCurve=new THREE.CatmullRomCurve3(roadPts);const road=new THREE.Mesh(new THREE.TubeGeometry(roadCurve,70,.62,6,false),mat(0x746e58));road.position.y=.13;scene.add(road);
// Rocky hills and low-poly trees as stylized environmental meshes
for(let i=0;i<28;i++){const x=(Math.random()-.5)*62,z=(Math.random()-.5)*56;if(Math.abs(x+z*.5)<6)continue;const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.8+Math.random()*1.5,0),mat(i%2?0x69745a:0x7b8063));rock.position.set(x,.35,z);rock.scale.y=.45+Math.random()*.6;rock.castShadow=true;rock.receiveShadow=true;scene.add(rock)}for(let i=0;i<55;i++){const x=(Math.random()-.5)*66,z=(Math.random()-.5)*60;if(Math.abs(x+z*.5)<5)continue;tree(x,z)}
// bridge and fixed outposts
const bridge=new THREE.Mesh(new THREE.BoxGeometry(5,.25,2.7),mat(0x93866b));bridge.position.set(0,.36,0);bridge.rotation.y=-.45;bridge.castShadow=true;scene.add(bridge);makeBase(-25,13,'blue');makeBase(25,-13,'red');makeOutpost(-4,-7);makeOutpost(7,8)}
function tree(x,z){const g=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.13,.2,1.25,5),mat(0x584936));trunk.position.y=.62;trunk.castShadow=true;g.add(trunk);const crown=new THREE.Mesh(new THREE.ConeGeometry(.85,2.25,6),mat(Math.random()>.5?0x3e6047:0x4b6949));crown.position.y=2; crown.castShadow=true;g.add(crown);g.position.set(x,0,z);scene.add(g)}
function makeBase(x,z,team){const g=new THREE.Group(),c=mat(team==='blue'?0x426e69:0x84584e);const base=new THREE.Mesh(new THREE.BoxGeometry(5,1.2,4),c);base.position.y=.65;base.castShadow=true;base.receiveShadow=true;g.add(base);const tower=new THREE.Mesh(new THREE.BoxGeometry(1.7,2.3,1.7),mat(team==='blue'?0x709487:0xa87867));tower.position.set(0,2.25,0);tower.castShadow=true;g.add(tower);const roof=new THREE.Mesh(new THREE.ConeGeometry(1.35,.8,4),mat(0x434a3c));roof.position.set(0,3.8,0);roof.rotation.y=Math.PI/4;g.add(roof);g.position.set(x,0,z);g.userData.baseTeam=team;scene.add(g);const ring=new THREE.Mesh(new THREE.RingGeometry(3.2,3.35,40),new THREE.MeshBasicMaterial({color:colors[team],side:THREE.DoubleSide,transparent:true,opacity:.8}));ring.rotation.x=-Math.PI/2;ring.position.set(x,.08,z);scene.add(ring)}
function makeOutpost(x,z){const g=new THREE.Group(),b=new THREE.Mesh(new THREE.CylinderGeometry(1.6,2,1.2,8),mat(0x756d50));b.position.y=.6;b.castShadow=true;g.add(b);const flag=new THREE.Mesh(new THREE.BoxGeometry(.08,2.6,.08),mat(0xd0c7a2));flag.position.set(0,2,0);g.add(flag);const cloth=new THREE.Mesh(new THREE.BoxGeometry(.9,.48,.06),mat(0xb9a366));cloth.position.set(.42,2.8,0);g.add(cloth);g.position.set(x,0,z);scene.add(g)}
function makeUnit(team,type,x,z){const group=new THREE.Group(),color=mat(colors[team]),dark=mat(team==='blue'?0x283c38:0x42302e),accent=mat(team==='blue'?0x9fc8a8:0xe09b7d);let hp=100,maxHp=100,range=type==='tank'?10:type==='infantry'?6:type==='scout'?8:4,speed=type==='tank'?2.4:type==='infantry'?2.8:type==='scout'?4:1.8,damage=type==='tank'?18:type==='infantry'?8:type==='scout'?7:0;
if(type==='infantry'){const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.28,.65,3,6),color);torso.position.y=1.05;torso.castShadow=true;group.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.22,8,6),accent);head.position.y=1.68;head.castShadow=true;group.add(head);for(const side of [-1,1]){const leg=new THREE.Mesh(new THREE.CylinderGeometry(.09,.12,.55,6),dark);leg.position.set(side*.13,.43,0);group.add(leg);const arm=new THREE.Mesh(new THREE.CylinderGeometry(.07,.1,.48,6),color);arm.position.set(side*.31,1.08,.04);arm.rotation.z=side*.28;group.add(arm)}const rifle=new THREE.Mesh(new THREE.BoxGeometry(.08,.08,.8),dark);rifle.position.set(.28,1.18,.34);group.add(rifle);maxHp=65;hp=65}
else{const bodyLen=type==='tank'?2.4:type==='supply'?2.2:1.75,bodyWid=type==='tank'?1.5:1.2;const hull=new THREE.Mesh(new THREE.BoxGeometry(bodyWid,.62,bodyLen),color);hull.position.y=.68;hull.castShadow=true;hull.receiveShadow=true;group.add(hull);for(const side of [-1,1]){const track=new THREE.Mesh(new THREE.BoxGeometry(.28,.45,bodyLen+.12),dark);track.position.set(side*(bodyWid/2+.1),.43,0);track.castShadow=true;group.add(track)}if(type==='tank'){const turret=new THREE.Mesh(new THREE.CylinderGeometry(.53,.58,.42,10),accent);turret.position.y=1.18;turret.castShadow=true;group.add(turret);const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.105,.13,1.25,8),dark);barrel.rotation.x=Math.PI/2;barrel.position.set(0,1.22,-.78);group.add(barrel);maxHp=190;hp=190}else if(type==='scout'){const cabin=new THREE.Mesh(new THREE.BoxGeometry(.9,.68,.85),accent);cabin.position.set(0,1.18,-.15);cabin.castShadow=true;group.add(cabin);for(const side of [-1,1])for(const front of [-1,1]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.13,8),dark);wheel.rotation.z=Math.PI/2;wheel.position.set(side*.65,.36,front*.62);group.add(wheel)}maxHp=90;hp=90}else{const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.05,.72,.72),accent);cabin.position.set(0,1.18,-.42);group.add(cabin);maxHp=120;hp=120}}
const health=new THREE.Mesh(new THREE.PlaneGeometry(1.2,.12),new THREE.MeshBasicMaterial({color:0x52dd81,side:THREE.DoubleSide}));health.position.set(0,2.3,0);health.userData.health=true;group.add(health);group.position.set(x,0,z);group.traverse(o=>{if(o.isMesh){o.castShadow=true;o.userData.unitId=null}});const u={id:Math.random().toString(36).slice(2),team,type,group,hp,maxHp,range,speed,damage,target:null,cool:Math.random(),alive:true};group.userData.unit=u;group.traverse(o=>o.userData.unit=u);scene.add(group);units.push(u);return u}
function reset(){for(const u of units)scene.remove(u.group);units=[];for(const e of effects)scene.remove(e);effects=[];selected=null;credits=1200;elapsed=0;ended=false;makeUnit('blue','infantry',-20,10);makeUnit('blue','infantry',-18,11);makeUnit('blue','tank',-17,14);makeUnit('blue','scout',-22,15);makeUnit('blue','supply',-24,10);makeUnit('red','infantry',19,-9);makeUnit('red','infantry',21,-11);makeUnit('red','tank',18,-14);makeUnit('red','scout',23,-13);updateUI();toast('战斗开始：守住前哨，摧毁敌方指挥所')}
function build(type){if(ended)return;const data={infantry:[100,-23,14],tank:[350,-22,13],scout:[220,-25,16],supply:[180,-26,11]}[type];if(credits<data[0]){toast('资金不足');return}credits-=data[0];const u=makeUnit('blue',type,data[1]+Math.random()*2,data[2]+Math.random()*2);if(selected)select(u);updateUI();toast('已部署'+unitName(type))}
function unitName(t){return{infantry:'步兵班',tank:'主战坦克',scout:'侦察车',supply:'补给车'}[t]}
function select(u){selected=u;for(const v of units){if(v.ring){scene.remove(v.ring);v.ring=null}}if(u){const r=new THREE.Mesh(new THREE.RingGeometry(.9,1.08,32),new THREE.MeshBasicMaterial({color:0xf0d47a,side:THREE.DoubleSide}));r.rotation.x=-Math.PI/2;r.position.set(u.group.position.x,.12,u.group.position.z);scene.add(r);u.ring=r}updateUI()}
function onPointer(e){if(ended)return;const rect=renderer.domElement.getBoundingClientRect();const mouse=new THREE.Vector2((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObjects(scene.children,true);let found=null;for(const hit of hits){let o=hit.object;while(o){if(o.userData&&o.userData.unit){found=o.userData.unit;break}o=o.parent}if(found)break}if(found&&found.team==='blue'){select(found);document.getElementById('message').textContent=unitName(found.type)+'已选中 · 点击地面移动，自动攻击射程内敌军';return}if(selected){const groundHits=raycaster.intersectObject(ground);if(groundHits.length){selected.target=groundHits[0].point.clone();toast('移动命令已下达')}}}
function shot(a,b,team){const start=a.group.position.clone();start.y=1.25;const end=b.group.position.clone();end.y=1;const geo=new THREE.BufferGeometry().setFromPoints([start,end]);const line=new THREE.Line(geo,new THREE.LineBasicMaterial({color:team==='blue'?0x9af4d3:0xff9a78,transparent:true,opacity:.95}));scene.add(line);effects.push({object:line,life:.13})}
function tick(dt){if(ended)return;elapsed+=dt;if(Math.floor(elapsed)%10===0&&Math.floor(elapsed-dt)!==Math.floor(elapsed))credits+=35;for(const u of units){if(!u.alive)continue;u.cool-=dt;if(u.ring)u.ring.position.set(u.group.position.x,.12,u.group.position.z);if(u.type==='supply'&&u.team==='blue'&&Math.floor(elapsed)%8===0&&Math.floor(elapsed-dt)!==Math.floor(elapsed))credits+=50;let enemies=units.filter(v=>v.alive&&v.team!==u.team);let target=null,best=u.range;for(const e of enemies){const d=u.group.position.distanceTo(e.group.position);if(d<best){best=d;target=e}}if(target){if(u.cool<=0&&u.damage>0){u.cool=u.type==='tank'?1.25:.9;target.hp-=u.damage;shot(u,target,u.team);if(target.hp<=0){target.alive=false;scene.remove(target.group);if(target.ring)scene.remove(target.ring);if(u.team==='blue')credits+=45;if(target===selected){selected=null;updateUI()}}}continue}if(u.team==='red'){u.target=new THREE.Vector3(-18,12,0)}if(u.target){const p=u.group.position,dx=u.target.x-p.x,dz=u.target.z-p.z,len=Math.hypot(dx,dz);if(len<.45){u.target=null}else{const step=Math.min(len,u.speed*dt);p.x+=dx/len*step;p.z+=dz/len*step;u.group.rotation.y=Math.atan2(dx,dz)}}}for(const ef of effects){ef.life-=dt}effects=effects.filter(e=>{if(e.life<=0){scene.remove(e.object);return false}return true});if(credits<0)credits=0;const redAlive=units.some(u=>u.alive&&u.team==='red');const blueAlive=units.some(u=>u.alive&&u.team==='blue');if(!redAlive){ended=true;document.getElementById('objective').textContent='任务完成 · 战区已控制';toast('胜利！敌方部队已被击退')}else if(!blueAlive){ended=true;document.getElementById('objective').textContent='任务失败 · 前哨失守';toast('任务失败！我方部队已撤出')}updateUI()}
function updateUI(){document.getElementById('credits').textContent='◈ '+Math.floor(credits);document.getElementById('clock').textContent='☼ '+String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(Math.floor(elapsed%60)).padStart(2,'0');const el=document.getElementById('unitinfo');if(!selected){el.innerHTML='未选择单位<br>点击我方步兵或载具选择，再点地面下达移动命令。';document.getElementById('selName').textContent='战术指令';document.getElementById('selDetail').textContent='选择单位 / 控制战场';return}el.innerHTML=unitName(selected.type)+' · '+(selected.team==='blue'?'我方':'敌方')+'<br>生命 '+Math.max(0,Math.ceil(selected.hp))+'/'+selected.maxHp+'　射程 '+selected.range+'<br>移动速度 '+selected.speed.toFixed(1)+'　'+(selected.type==='tank'?'重装甲 · 对地强':'步兵 · 占点') ;document.getElementById('selName').textContent=unitName(selected.type);document.getElementById('selDetail').textContent='生命 '+Math.max(0,Math.ceil(selected.hp))+'/'+selected.maxHp+' · 自动交战'}
let toastTimer;function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2100)}function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);tick(dt);renderer.render(scene,camera)}setup()})();
</script></body></html>
